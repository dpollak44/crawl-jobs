# One command runs the whole system: docker compose up --build
# Start order is enforced by health checks, not by hope: the API and worker wait until Postgres and RabbitMQ answer.
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler
    ports:
      - "127.0.0.1:5433:5432"   # local only; host port 5433 because a developer machine may already have a Postgres on 5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    restart: unless-stopped
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:5672:5672"     # local only: the default guest/guest login is for this machine, never a network
      - "127.0.0.1:15672:15672"   # management UI: http://localhost:15672 (guest/guest), the queues and the dead-letter box
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    restart: unless-stopped
    image: crawl-jobs-api
    build:
      context: .
      args:
        PROJECT: Crawler.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=crawler;Username=crawler;Password=crawler
      RabbitMq__Host: broker
      Cors__Origins__0: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"   # local only: the API has no login by design
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      # bash alone can open a socket, so the slim runtime image needs no extra tool for its health check
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    restart: unless-stopped
    image: crawl-jobs-worker
    build:
      context: .
      args:
        PROJECT: Crawler.Worker
    environment:
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Default: Host=db;Port=5432;Database=crawler;Username=crawler;Password=crawler
      RabbitMq__Host: broker
    # No host port, so `docker compose up --scale worker=3` works. Health shows in `docker compose ps`.
    depends_on:
      api:
        condition: service_healthy   # the API creates the schema; the worker starts after it exists
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    restart: unless-stopped
    image: crawl-jobs-web
    build:
      context: ./src/web
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
